<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Подключение Miro — DETROYD SMART SYSTEM</title>
<style>
:root{--bg:#08090B;--panel:#0F1116;--line:rgba(255,255,255,.08);--txt:#F0F2F5;--txt-2:#A6AEB9;--accent:#37E6C8;--neg:#F0785C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center}
.c{max-width:430px}
.i{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;margin:0 auto 20px;font-size:28px}
.ok .i{background:rgba(55,230,200,.12);border:1px solid rgba(55,230,200,.3)}
.err .i{background:rgba(240,120,92,.12);border:1px solid rgba(240,120,92,.3)}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
p{color:var(--txt-2);font-size:14.5px;line-height:1.65;margin-bottom:24px}
b{color:var(--txt);font-weight:600}
a{display:inline-block;background:var(--accent);color:#08090B;text-decoration:none;font-weight:600;
  padding:12px 24px;border-radius:10px;font-size:14px}
.hint{margin-top:18px;font-size:12.5px;color:#7C848F}
</style>
</head>
<body>
<div class="c ok" id="card">
  <div class="i" id="ic">✓</div>
  <h1 id="ttl">Miro подключён</h1>
  <p id="msg">Возвращайтесь в систему — доска появится в карточке проекта.</p>
  <a href="/" id="back">Вернуться в систему</a>
  <div class="hint" id="hint"></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var ok = q.get('ok') !== '0';
  var team = q.get('team') || '';
  var msg = q.get('msg') || '';

  var card = document.getElementById('card');
  var safeTeam = team.replace(/[<>&]/g, '');
  if(!ok){
    card.className = 'c err';
    document.getElementById('ic').textContent = '!';
    document.getElementById('ttl').textContent = 'Подключить не получилось';
    document.getElementById('msg').textContent = msg || 'Miro не подтвердил доступ. Попробуйте ещё раз.';
  } else if(team){
    document.getElementById('msg').innerHTML =
      'Команда <b>' + safeTeam + '</b> подключена. Возвращайтесь в систему — доска появится в карточке проекта.';
  }

  /* Окно открыто из системы — сообщаем ей результат и закрываемся сами.
     Если открывали прямо в этой вкладке, opener пуст — тогда просто
     показываем карточку с кнопкой возврата. */
  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({ miro: ok ? 'connected' : 'error', team: team }, '*');
      document.getElementById('hint').textContent = 'Окно закроется само…';
      setTimeout(function(){ try{ window.close(); }catch(e){} }, 1400);
    }
  }catch(e){}
})();
</script>
</body>
</html>
